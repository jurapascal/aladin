<!-- Jen v samostatné appce (desktop/): její menu jako proužek nahoře, na místě
     nativní lišty, kterou appka schová (hub.js, appMenu). Nativní menu Electronu
     má rozbalené položky velké jako pro prst, tady jsou stejně malé jako lišta. -->
<nav id="appmenu" class="appmenu" hidden></nav>
<header class="topbar">
  <!-- Jen na úzké obrazovce: postranní panel je tam šuplík, tohle je klika. -->
  <button id="btn-drawer" class="iconbtn drawer-toggle" title="Projekty a chaty">
    <svg class="ico"><use href="#i-menu"/></svg></button>
  <div class="topbar-title">
    <!-- Logo a název = domů na úvodní stránku (i s otevřenými taby). -->
    <button id="btn-home" class="topbar-home" title="Úvodní stránka">
      <svg class="ico brand-ico"><use href="#i-aladin"/></svg><strong>Aladin</strong></button>
    <button id="btn-place" class="topbar-badge"></button>
    <!-- Prostor okna: osobní, firma (gateway/firmy.py), nebo cizí prostor, kam
         mě vlastník pustil (gateway/pristup.py) — hub.js prostorMenu. -->
    <button id="btn-prostor" class="topbar-prostor" hidden>
      <span class="prostor-dot"></span><span class="prostor-name">Osobní</span>
      <svg class="ico prostor-caret"><use href="#i-chevron"/></svg></button>
    <!-- Jen na telefonu: jméno otevřeného tabu uprostřed lišty (mobile.js),
         lišta s taby se tam nevejde. -->
    <span class="topbar-tabwrap"><span id="topbar-tab" class="topbar-tab"></span><span id="topbar-stav" class="topbar-stav"></span></span>
  </div>
  <div class="topbar-actions">
    <button id="btn-update" class="topbar-update" hidden>
      <svg class="ico"><use href="#i-up"/></svg><span id="btn-update-text"></span></button>
    <!-- Jen na serveru: oznámení pro člověka (oznameni.js). Ve stejné skupině
         ikon jako obnovit, motiv, statistiky a nastavení; na telefonu je to
         jediná z nich, co zůstává vedle Chyby/Návrhu a nabídky ⋯. -->
    <button id="btn-zvonek" class="iconbtn topbar-zvonek" title="Oznámení" aria-label="Oznámení" hidden>
      <svg class="ico"><use href="#i-bell"/></svg></button>
    <button id="btn-refresh" class="iconbtn" title="Načíst projekty a paměť znovu (neaktualizuje aplikaci)">
      <svg class="ico"><use href="#i-refresh"/></svg></button>
    <button id="btn-theme" class="iconbtn" title="Přepnout světlý/tmavý režim">
      <svg class="ico"><use href="#i-moon"/></svg></button>
    <button id="btn-stats" class="iconbtn" title="Statistiky používání">
      <svg class="ico"><use href="#i-chart"/></svg></button>
    <button id="btn-settings" class="iconbtn" title="Nastavení a aktualizace">
      <svg class="ico"><use href="#i-gear"/></svg></button>
    <!-- Chyba / Návrh (Verxee Debug) až za ikonami. -->
    <span id="btn-verxee" class="verxee-split" hidden>
      <button type="button" class="vx-chyba" data-klavesa="B" title="Nahlásit chybu (Alt+Shift+B)" aria-label="Nahlásit chybu">
        <svg class="ico"><use href="#i-ladybug"/></svg><span>Chyba</span></button><button type="button" class="vx-navrh" data-klavesa="N" title="Podat návrh (Alt+Shift+N)" aria-label="Podat návrh">
        <svg class="ico"><use href="#i-bulb-on"/></svg><span>Návrh</span></button></span>
    <!-- Jen na telefonu: všechno z lišty pod jednou ikonou. Čtyři ikony vedle
         sebe se na 320 px nevejdou a na to, co která dělá, se nedá sáhnout. -->
    <button id="btn-new-top" class="iconbtn topbar-new" title="Nový chat">
      <svg class="ico"><use href="#i-compose"/></svg></button>
    <button id="btn-menu" class="iconbtn topbar-menu" title="Nabídka">
      <svg class="ico"><use href="#i-more"/></svg></button>
  </div>
</header>

<div class="layout">
  <!-- Jen na počítači: schovat / ukázat panely, na hraně panelu, kde se tahem
       mění jeho šířka (panely.js), jako v appce Claude. -->
  <button id="btn-panel-levy" class="panel-toggle" title="Schovat panel s chaty" aria-label="Panel s chaty">
    <svg class="ico"><use href="#i-panel-levy"/></svg></button>
  <button id="btn-panel-pravy" class="panel-toggle" title="Schovat panel vpravo" aria-label="Panel vpravo" hidden>
    <svg class="ico"><use href="#i-panel-pravy"/></svg></button>


  <aside class="sidebar">
    <!-- Jen na telefonu: hlavička šuplíku — logo a název (= domů), hledání,
         nastavení a ⋯ s tím, co je na počítači v liště. Lupa z hlavičky udělá
         pole na hledání chatů (hub.js, drawerHledat). Šuplík se zavírá
         klepnutím vedle nebo přejetím. -->
    <div class="drawer-head">
      <button id="btn-drawer-brand" class="drawer-brand" title="Úvodní stránka">
        <svg class="ico brand-ico"><use href="#i-aladin"/></svg><strong>Aladin</strong></button>
      <span class="drawer-head-akce">
        <button id="btn-drawer-hledat" class="iconbtn" title="Hledat chat" aria-label="Hledat chat">
          <svg class="ico"><use href="#i-search"/></svg></button>
        <button id="btn-drawer-nastaveni" class="iconbtn" title="Nastavení" aria-label="Nastavení">
          <svg class="ico"><use href="#i-gear"/></svg></button>
        <button id="btn-drawer-menu" class="iconbtn" title="Další" aria-label="Další">
          <svg class="ico"><use href="#i-more"/></svg></button>
      </span>
    </div>
    <!-- Hlavní nabídka jako v appce Claude: nový chat, přepnutí seznamu mezi
         chaty a projekty, poznámky. Domů jen na telefonu (na počítači vede
         domů logo v liště). -->
    <nav class="side-nav">
      <button id="btn-drawer-new" class="nav-item nav-new">
        <span class="nav-ico nav-plus"><svg class="ico"><use href="#i-plus"/></svg></span> <span class="nav-text">Nový chat</span></button>
      <!-- Jen na serveru s firemním Obsidianem: druhý, fialový chat. -->
      <button id="btn-drawer-firma" class="nav-item nav-new firma" hidden>
        <span class="nav-ico nav-plus"><svg class="ico"><use href="#i-plus"/></svg></span> <span class="nav-text">Server firemní</span></button>
      <button id="nav-hledat" class="nav-item nav-claude">
        <span class="nav-ico"><svg class="ico"><use href="#i-search"/></svg></span> Hledat</button>
      <button id="nav-projekty" class="nav-item">
        <span class="nav-ico"><svg class="ico"><use href="#i-folder"/></svg></span> Projekty</button>
      <!-- Poznámky jsou jen v Obsidianu: jedna položka, osobní / firemní /
           sdílené se přepínají uvnitř (vault.js). -->
      <button id="btn-brain" class="nav-item" hidden>
        <span class="nav-ico"><svg class="ico"><use href="#i-book"/></svg></span> Obsidian</button>
      <button id="nav-customize" class="nav-item nav-claude">
        <span class="nav-ico"><svg class="ico"><use href="#i-plus"/></svg></span> Přizpůsobit</button>
      <button id="nav-terminal" class="nav-item nav-claude" hidden>
        <span class="nav-ico"><svg class="ico"><use href="#i-terminal"/></svg></span> Terminál</button>
    </nav>
    <div id="open-section" class="open-section" hidden>
      <div class="section">Otevřené</div>
      <div id="open-tabs" class="open-tabs"></div>
    </div>
    <div class="section section-head">
      <span id="list-head">Chaty</span>
      <span class="section-count" id="projects-count"></span>
      <span class="section-count" id="chats-count" hidden></span>
      <button id="btn-chats-vyber" class="iconbtn chats-vyber-btn" title="Vybrat více chatů" aria-label="Vybrat více chatů">
        <svg class="ico"><use href="#i-check"/></svg></button>
      <!-- Jen na telefonu: šuplík překrývá horní lištu i kliku, kterou se
           otevřel, tak se zavírá odsud. -->
      <button id="btn-drawer-close" class="iconbtn drawer-close" title="Zavřít panel">
        <svg class="ico"><use href="#i-close"/></svg></button>
    </div>
    <!-- Seznam projektů v panelu už není (Projekty jsou stránka, #projekty-page);
         prvky tu zůstávají pro renderProjects. -->
    <div id="projects-view" hidden>
      <div class="searchwrap">
        <svg class="ico search-ico"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Hledat projekt…" autocomplete="off" name="hub-hledat-projekt" spellcheck="false" data-1p-ignore data-lpignore="true">
      </div>
      <div id="projects" class="cards"></div>
    </div>
    <div id="chats-view">
      <div id="chats-vyber" class="chats-vyber" hidden>
        <div class="chats-vyber-hlava">
          <span id="chats-vyber-pocet" class="chats-vyber-pocet"></span>
          <button type="button" class="keep-drawer chats-vyber-hotovo" data-akce="konec">Hotovo</button>
        </div>
        <div class="chats-vyber-akce">
          <button type="button" class="keep-drawer" data-akce="vse">Vše</button>
          <button type="button" class="keep-drawer" data-akce="pripnout">Připnout</button>
          <button type="button" class="keep-drawer" data-akce="export">Export</button>
          <button type="button" class="keep-drawer danger" data-akce="smazat">Smazat</button>
        </div>
      </div>
      <div class="searchwrap" hidden>
        <svg class="ico search-ico"><use href="#i-search"/></svg>
        <input id="chats-search" type="search" placeholder="Hledat chat…" autocomplete="off" name="hub-hledat-chat" spellcheck="false" data-1p-ignore data-lpignore="true">
      </div>
      <div id="chats" class="chats"></div>
    </div>

    <div id="memory-section" hidden>
      <div id="memory-summary" class="mem-summary"></div>
      <div id="memory" class="cards"></div>
    </div>

    <div id="shared-section" hidden>
      <div class="section">Sdílené poznámky</div>
      <div id="shared-list" class="chats"></div>
    </div>

    <div id="relace-section" hidden>
      <div class="section">Sdílené chaty</div>
      <div id="relace-list" class="chats"></div>
    </div>

    <div class="spacer"></div>
    <div id="footer" class="footer"></div>
  </aside>

  <main class="main">
    <div class="tabbar" id="tabbar">
      <button id="btn-new-agent" class="tabplus" title="Nový chat s Claudem">
        <svg class="ico"><use href="#i-plus"/></svg><span>Nový chat</span></button>
      <button id="btn-new-firma" class="tabplus firma" title="Chat s Claudem nad firemními poznámkami" hidden>
        <svg class="ico"><use href="#i-plus"/></svg><span>Firemní</span></button>
      <button id="btn-new-shell" class="tabplus" title="Otevřít terminál" hidden>
        <svg class="ico"><use href="#i-plus"/></svg><span>Terminál</span></button>
      <!-- Jen na telefonu: tři „+" vedle sebe zabraly celou lištu a na taby
           nezbylo místo. Tohle je jedno „+" a nabídka, co otevřít. -->
      <button id="btn-new-menu" class="tabplus tabplus-one" title="Nový chat">
        <svg class="ico"><use href="#i-plus"/></svg></button>
      <!-- Sdílení chatu s kolegy (hub.js sdiletChat) — jen na serveru. -->
      <button id="btn-sdilet" class="tabplus tab-sdilet" title="Sdílet tenhle chat s kolegy" hidden>
        <svg class="ico"><use href="#i-user"/></svg><span>Sdílet</span></button>
    </div>
    <div class="panes" id="panes">
      <!-- Projekty jako stránka, jako claude.ai/projects (hub.js showProjekty). -->
      <div class="projekty-page" id="projekty-page" hidden>
        <div class="pp-in">
          <div class="pp-head">
            <h1 id="pp-title">Projekty</h1>
            <span class="spacer"></span>
            <button class="btn ghost pp-sort" id="pp-sort" title="Řazení">Naposledy upravené</button>
            <button class="btn primary" id="pp-new">Otevřít složku…</button>
          </div>
          <div class="searchwrap pp-search">
            <svg class="ico search-ico"><use href="#i-search"/></svg>
            <input id="pp-q" type="search" placeholder="Hledat projekt…" autocomplete="off">
          </div>
          <div class="pp-grid" id="pp-grid"></div>
        </div>
      </div>
      <div class="welcome" id="welcome">
        <div class="welcome-scene" id="welcome-scene"></div>
        <!-- „Hub" tu bývalo napevno. Teď se píše prostředí (renderWelcome):
             na počítači „Claude Code PC", v prostoru „Claude Code server". -->
        <div class="welcome-big">Aladin <b id="welcome-place"></b></div>
        <div class="welcome-greet" id="welcome-greet"></div>
        <!-- Otevřené chaty (taby) — appka po otevření zůstává tady, na Domů. -->
        <div class="welcome-open" id="welcome-open" hidden></div>
        <!-- Nová verze: napřed aktualizovat, pak pracovat (hub.js, renderWelcomeUpdate). -->
        <div class="welcome-update" id="welcome-update" hidden></div>
        <!-- Jen v motivu Claude (hub.css: .welcome-prompt je jinak skryté): úvod jako
             nový chat — pole na psaní, odeslání otevře chat a pošle mu zprávu. -->
        <div class="welcome-prompt" id="welcome-prompt">
          <textarea id="welcome-prompt-input" rows="2" spellcheck="false" autocomplete="off"
                    placeholder="Na čem budeme pracovat?"></textarea>
          <div class="welcome-prompt-bar">
            <span class="spacer"></span>
            <button id="welcome-prompt-send" class="composer-send" title="Odeslat (Enter)" aria-label="Odeslat"><svg class="ico"><use href="#i-up"/></svg></button>
          </div>
        </div>
        <div class="welcome-actions" id="welcome-actions"></div>
        <!-- Firmy: dlaždice v osobním prostoru, přehled klientů ve firmě. -->
        <div class="welcome-firmy" id="welcome-firmy" hidden></div>
        <div class="welcome-cols" id="welcome-cols"></div>
        <div class="welcome-usage" id="welcome-usage" hidden></div>
        <div class="welcome-stats" id="welcome-stats" hidden></div>
        <div class="welcome-facts" id="welcome-facts"></div>
        <div class="welcome-warn" id="welcome-warn" hidden></div>
      </div>
    </div>
  </main>

  <aside class="actionbar" id="actionbar" hidden>
    <!-- Průběh chatu jako v appce Claude (hub.js renderPrehled). -->
    <div class="prehled" id="prehled" hidden></div>
    <div class="barlabel">Rychlé akce</div>
    <div id="actions"></div>
    <!-- Stopky jsou vlastní sekce: jedou mimo agenta, tak se ukazují i v tabu,
         kde rychlé akce nedávají smysl. -->
    <div class="barlabel" id="clockify-label" hidden>Stopky</div>
    <div id="clockify" hidden></div>
  </aside>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modal-title">Vyber složku</strong>
      <button class="iconbtn" id="modal-close"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-roots" id="modal-roots"></div>
    <div class="modal-path" id="modal-path"></div>
    <div class="modal-list" id="modal-list"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="modal-cancel">Zrušit</button>
      <button class="btn primary" id="modal-open">Otevřít tuhle složku</button>
    </div>
  </div>
</div>

<div class="modal" id="confirm" hidden>
  <div class="modal-box confirm-box">
    <div class="modal-head"><strong id="confirm-title">Zavřít?</strong></div>
    <div class="confirm-text" id="confirm-text"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="confirm-no">Ne</button>
      <button class="btn primary" id="confirm-yes">Ano</button>
    </div>
  </div>
</div>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<div class="ctxmenu" id="ctxmenu" hidden></div>
<div class="toast" id="toast" hidden></div>
